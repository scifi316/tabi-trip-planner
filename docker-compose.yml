# Single host (no failover). For the Fly.io + home-server pair, see deploy/ and docs/HOSTING.md.
services:
  tabi:
    build: .
    container_name: tabi
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    env_file: .env          # copy .env.example to .env first
