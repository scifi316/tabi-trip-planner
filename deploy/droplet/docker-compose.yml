# Primary server: DigitalOcean droplet in Singapore (set up by deploy/setup.sh).
# Values (keys, tokens, HA_NODE) live in .env next to this file.
services:
  tabi:
    build:
      context: ../..
    image: tabi:latest
    container_name: tabi
    restart: always            # it exits on purpose when it steps down or hands over
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      HA_MODE: "on"
      HA_PRIORITY: "primary"
      TRUST_PROXY: "true"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # No ports: the site is reached only through the Cloudflare Tunnel the app starts while serving.
