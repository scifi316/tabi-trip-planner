# Home server backup. Same image; stays on standby until the primary stops renewing its lease.
# Linux:   sudo bash deploy/setup.sh --role backup --node home
# Windows/macOS (Docker Desktop): copy ../../.env.example to .env here, fill it in, then
#          docker compose up -d --build
services:
  tabi:
    build:
      context: ../..
    image: tabi:latest
    container_name: tabi-backup
    restart: always            # it exits on purpose when it hands back to the primary
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      HA_MODE: "on"
      HA_PRIORITY: "backup"
      TRUST_PROXY: "true"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Optional: reach it on your LAN while it is serving. Not needed for the public site.
    # ports:
    #   - "8080:8080"
