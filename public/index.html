<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Tabi</title>
  <meta name="theme-color" content="#F4F5F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14171C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tabi">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var t = localStorage.getItem('tabi.theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <div id="auth" class="auth" hidden></div>

  <div id="app" class="app" hidden>
    <main class="screens">
      <section id="screen-map" class="screen screen-map" aria-label="Map">
        <div id="map" class="map"></div>
        <header class="map-top">
          <button class="me-btn" data-me-btn aria-label="Your account"></button>
          <div class="search" role="search">
            <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
            <input id="search-input" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
                   placeholder="Search or paste a link" aria-label="Search places">
            <button id="search-clear" class="icon-btn small" aria-label="Clear search" hidden>
              <svg class="i"><use href="#i-x"/></svg>
            </button>
          </div>
        </header>
        <div id="search-results" class="search-results" hidden></div>
        <div id="friend-row" class="friend-row" aria-label="Friends sharing location"></div>
        <div class="map-controls">
          <button class="ctl" id="ctl-locate" aria-label="Show my location"><svg class="i"><use href="#i-locate"/></svg></button>
          <button class="ctl" id="ctl-fit" aria-label="Fit all stops"><svg class="i"><use href="#i-fit"/></svg></button>
          <button class="ctl" id="ctl-layers" aria-label="Choose which places to show" aria-expanded="false"><svg class="i"><use href="#i-layers"/></svg></button>
        </div>
        <div id="layers-pop" class="popover layers-pop" hidden></div>
        <button id="fab-add" class="fab" aria-label="Add places"><svg class="i"><use href="#i-plus"/></svg></button>
        <div id="line-strip" class="line-strip" aria-label="Today's stops"></div>
      </section>

      <section id="screen-itinerary" class="screen screen-page" aria-label="Itinerary" hidden></section>
      <section id="screen-money" class="screen screen-page" aria-label="Money" hidden></section>
      <section id="screen-settings" class="screen screen-page" aria-label="Settings" hidden></section>
    </main>

    <nav id="tabbar" class="tabbar" aria-label="Screens">
      <button class="tab" data-tab="map"><svg class="i"><use href="#i-map"/></svg><span>Map</span></button>
      <button class="tab" data-tab="itinerary"><svg class="i"><use href="#i-calendar"/></svg><span>Itinerary</span></button>
      <button class="tab" data-tab="money"><svg class="i"><use href="#i-yen"/></svg><span>Money</span></button>
      <button class="tab" data-tab="settings"><svg class="i"><use href="#i-settings"/></svg><span>Settings</span></button>
      <button class="tab collapse" id="nav-collapse" aria-label="Hide navigation"><svg class="i"><use href="#i-chevron-down"/></svg></button>
    </nav>
    <button id="nav-handle" class="nav-handle" aria-label="Show navigation" hidden>
      <svg class="i"><use href="#i-map"/></svg><svg class="i small"><use href="#i-chevron-up"/></svg>
    </button>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Icon sprite: 24px grid, 1.75 stroke -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>

      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17h2"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>

      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><circle cx="12" cy="12" r="2"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 8.5 4.5L12 13 3.5 8.5 12 4Z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>

      <symbol id="i-down" viewBox="0 0 24 24"><path d="M7 13V4H4.5a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1H7Zm0 0 3.6 6.6a1.6 1.6 0 0 0 3-.9L13 14.5h5.3a2 2 0 0 0 2-2.3l-1.1-6.5a2 2 0 0 0-2-1.7H7"/></symbol>

      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="18" cy="18" r="2.3"/><path d="m8 11 8-4M8 13l8 4"/></symbol>

      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></symbol>
      <symbol id="i-yen" viewBox="0 0 24 24"><path d="M6 4l6 8 6-8M12 12v8M7.5 13h9M7.5 16.5h9"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="16.5" cy="9" r="2.6"/><path d="M15.5 14.6c2.4-.2 4.4 1.3 5 4.4"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>

      <symbol id="i-clip" viewBox="0 0 24 24"><path d="m19 11.5-7.4 7.4a4.6 4.6 0 0 1-6.5-6.5l7.8-7.8a3 3 0 0 1 4.3 4.3l-7.7 7.7a1.5 1.5 0 0 1-2.1-2.1l7-7"/></symbol>

    </defs>
  </svg>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
